    type: t
    x: 10
    y: 6
    w: 165
    h: 18
    txt: "RPM"

  - objname: tRpmVal        # id: n/a (read-only, firmware writes value via encode_text)
    type: t
    x: 10
    y: 26
    w: 165
    h: 38
    txt: "0"
    font: 2

  - objname: tSpeedLabel    # id: n/a
    type: t
    x: 185
    y: 6
    w: 165
    h: 18
    txt: "SPEED"

  - objname: tSpeedVal      # id: n/a
    type: t
    x: 185
    y: 26
    w: 165
    h: 38
    txt: "0"
    font: 2

  - objname: tAngleLabel    # id: n/a
    type: t
    x: 360
    y: 6
    w: 165
    h: 18
    txt: "ANGLE"

  - objname: tAngle         # firmware id 10 -- Key::ZeroTurns (tap value to zero)
    type: t
    x: 360
    y: 26
    w: 165
    h: 38
    txt: "0.0"
    font: 2

  - objname: tTurnsLabel    # id: n/a
    type: t
    x: 535
    y: 6
    w: 165
    h: 18
    txt: "TURNS"

  - objname: tTurns         # firmware id 9 -- Key::ZeroTurns (tap value to zero)
    type: t
    x: 535
    y: 26
    w: 165
    h: 38
    txt: "0"
    font: 2

  - objname: bSetup         # firmware id 59 -- Key::Setup
    type: b
    x: 715
    y: 5
    w: 75
    h: 60
    txt: "SETUP"

  # ============================================================
  # Left column: virtual-nut toggle + mode row + step controls
  # ============================================================
  - objname: bVirtualNutOff   # firmware id 3 -- Key::Disengage (visible when disengaged)
    type: b
    x: 10
    y: 85
    w: 260
    h: 180
    txt: "DISENGAGED"
    bco: 0x39c7   # dim red/grey -- placeholder RGB565

  - objname: bVirtualNutOn    # firmware id 25 -- Key::Engage (visible when engaged, same geometry)
    type: b
    x: 10
    y: 85
    w: 260
    h: 180
    txt: "ENGAGED"
    bco: 0x0640   # green -- placeholder RGB565

  - objname: bReverse       # firmware id 5 -- Key::Reverse
    type: b
    x: 10
    y: 280
    w: 125
    h: 60
    txt: "REV"

  - objname: bMeasure       # firmware id 6 -- Key::ToggleUnit
    type: b
    x: 145
    y: 280
    w: 125
    h: 60
    txt: "mm/in"

  - objname: bStep          # firmware id 7 -- Key::CycleStep (shows + cycles current step size)
    type: b
    x: 10
    y: 350
    w: 260
    h: 60
    txt: "STEP: 0.100mm"

  - objname: bStepSize0     # firmware id 53 -- Key::StepSize(0)
    type: b
    x: 10
    y: 420
    w: 50
    h: 50
    txt: "0.01"

  - objname: bStepSize1     # firmware id 54 -- Key::StepSize(1)
    type: b
    x: 62
    y: 420
    w: 50
    h: 50
    txt: "0.05"

  - objname: bStepSize2     # firmware id 55 -- Key::StepSize(2)
    type: b
    x: 114
    y: 420
    w: 50
    h: 50
    txt: "0.1"

  - objname: bStepSize3     # firmware id 56 -- Key::StepSize(3)
    type: b
    x: 166
    y: 420
    w: 50
    h: 50
    txt: "0.5"

  - objname: bStepSize4     # firmware id 57 -- Key::StepSize(4)
    type: b
    x: 218
    y: 420
    w: 52
    h: 50
    txt: "1.0"

  # ============================================================
  # Middle column: pitch display, +/-, zero-Z, jog
  # ============================================================
  - objname: tPitch         # id: n/a (read/entry display, no touch handler in ui.rs today)
    type: t
    x: 290
    y: 85
    w: 250
    h: 70
    txt: "0.000 mm"
    font: 2

  - objname: bMinus         # firmware id 43 -- Key::Minus
    type: b
    x: 290
    y: 165
    w: 115
    h: 60
    txt: "-"

  - objname: bPlus          # firmware id 42 -- Key::Plus
    type: b
    x: 425
    y: 165
    w: 115
    h: 60
    txt: "+"

  - objname: bZ0            # firmware id 21 -- Key::ZeroZ
    type: b
    x: 290
    y: 235
    w: 250
    h: 60
    txt: "ZERO Z"

  - objname: bJogLeft       # firmware id 48 -- Key::Jog{left:true} (needs press+release, see nextion.rs)
