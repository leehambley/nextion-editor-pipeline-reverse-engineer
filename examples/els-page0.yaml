# Full page-0 layout for the NanoEls-style ELS (Electronic Lead Screw)
# firmware whose `ui::Key`/`nextion.rs::key_for` this is built against.
#
# THIS IS TASK 1 (layout design) ONLY -- a content/design artifact, not
# something you can `nxtft compile` today. Turning it into a real .HMI/
# .tft is Task 2 (see docs/formats/nextion-tft-format.md section 6 and
# docs/targets.md's "compiling without the Nextion Editor" section for
# why that's a separate, harder problem with its own open questions).
#
# Every `Key` variant in ui.rs and every firmware component id in
# nextion.rs's `key_for()` has exactly one component below -- cross-check
# both ways before changing ids. `id` is kept as a comment (not a real
# spec field) for the same reason the original draft
# (inputs-from-claude/future_ui_page0.yaml) did: it's the contract with
# the firmware side, so whatever eventually gets built from this needs
# each named component to end up with that exact id.
#
# Zones (800x480):
#   - Top strip (y 0-70): RPM / SPEED / ANGLE / TURNS readouts, plus a
#     separated SETUP button in the corner (per user request: readouts
#     grouped, config button visually distinct).
#   - Left column (x 0-280): the "virtual nut" engage/disengage toggle,
#     made large per user request, plus reverse/unit/step-cycle controls
#     and the 5-way step-size selector below it.
#   - Middle column (x 280-540): current pitch display, +/- step nudges,
#     zero-Z, and the jog controls (left/right/cycle).
#   - Right column (x 540-800): phone-style numeric keypad with
#     Backspace and Enter both large and clearly separated from the
#     digit grid (per user request), plus the two travel-stop buttons
#     in the space below the keypad.
#
# Design decisions worth a human sanity-check before building anything:
#   - The old h5.HMI's `bStatus`/`bOff` both mapped to firmware id 3
#     (Disengage) alongside id 23, which the original draft flagged as
#     possibly a legacy/unused duplicate. This layout drops id 23
#     entirely and uses only id 3 for the "disengaged" half of the
#     virtual-nut toggle -- confirm the firmware doesn't still expect a
#     component using id 23 anywhere.
#   - The virtual-nut toggle is modeled as two same-position buttons
#     (`bVirtualNutOff` id 3, `bVirtualNutOn` id 25) with the firmware
#     expected to show one and hide the other via a `vis` instruction on
#     state change -- a standard Nextion technique, not a new component
#     type. `nextion.rs` doesn't currently send `vis` commands; that's a
#     firmware-side gap this layout exposes, not something this repo's
#     toolkit can fix.
#   - `bStep` (id 7, CycleStep) is modeled as a single button that both
#     displays the current step size *and* cycles it on tap, resolving
#     the original draft's open question about whether "bStep" and a
#     separate "tStepVal" label were meant to be one component or two --
#     here they're one, showing e.g. "STEP: 0.100mm".
#   - RPM/SPEED readouts have no `Key` mapping in ui.rs (read-only
#     displays) so they get no firmware-meaningful id; marked `id: n/a`.
#   - One keypad grid cell (row 4, column 3) is intentionally left empty
#     -- there are only 10 digits + point to place in a 3-wide grid, and
#     forcing an 11th control into that slot didn't have an obvious
#     candidate. Free for whatever's missing once this is reviewed.

target: NX8048P050-011R-Y
page: page0

components:
