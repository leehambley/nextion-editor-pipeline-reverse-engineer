# Draft DSL for the *new* page 0 — the contract between this reverse-
# engineering session and your Claude Code firmware session.
#
# `id` values below are copied directly from nextion.rs's `key_for()` /
# the doc comment above it ("Component ids on page 0 of the HMI ... See
# docs/nextion.md") -- so whatever we generate from this file will line
# up with the firmware's touch-event → Key mapping with zero renumbering
# on either side. If the firmware's id list changes, update it here too
# and this stays the single source of truth for both sessions.
#
# x/y/w/h are placeholders (TODO) -- fill in from your actual layout, or
# tell me the screen size + rough grid and I'll propose a layout.
#
# type: t=text/label, b=button, y=page container (reserved, don't use)

page: page0
w: 800
h: 480

components:
  # -- status / mode --
  - objname: bStatus     # also serves as bOff -- see note
    type: b
    id: 3
    x: TODO
    y: TODO
    w: TODO
    h: TODO
    txt: "OFF"
    note: "id 3 is shared by bStatus and bOff in the firmware match arm (3 | 23 => Disengage)"

  - objname: bOn
    type: b
    id: 25
    x: TODO
    y: TODO
    w: TODO
    h: TODO
    txt: "ON"

  - objname: bReverse
    type: b
    id: 5
    x: TODO
    y: TODO
    w: TODO
    h: TODO
    txt: "REV"

  - objname: bMeasure
    type: b
    id: 6
    x: TODO
    y: TODO
    w: TODO
